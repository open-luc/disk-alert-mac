name: Build and release

on:
  push:
    # main publishes a public release. claude/ branches publish an alpha (a GitHub pre-release,
    # offered only to people who opt in) and save logs and screenshots to the -preview branches.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'release' || format('preview-{0}', github.ref) }}
  cancel-in-progress: false

env:
  OUT_SUFFIX: ${{ github.ref != 'refs/heads/main' && '-preview' || '' }}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          # Public releases only: alpha tags (v0.4.1-alpha.18) don't count.
          LAST="$(git tag -l "v$BASE.*" | grep -E "^v${BASE//./\\.}\.[0-9]+$" | sort -V | tail -1 || true)"
          if [[ -n "$LAST" ]]; then
            PATCH=$(( ${LAST##*.} + 1 ))
          else
            PATCH=0
          fi
          # An alpha is numbered as the public release it leads up to.
          PRERELEASE=""
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then PRERELEASE="alpha.$GITHUB_RUN_NUMBER"; fi
          FULL="$BASE.$PATCH${PRERELEASE:+-$PRERELEASE}"
          echo "version=$BASE.$PATCH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "Version $FULL (previous release: ${LAST:-none})"

      - name: Build app
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -o pipefail
          chmod +x scripts/build.sh
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/build.sh 2>&1 | tee build.log

      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
          VERSION: ${{ steps.version.outputs.full }}
        run: |
          mkdir -p /tmp/ci-logs
          cp build.log /tmp/ci-logs/build.log 2>/dev/null || echo "No log produced" > /tmp/ci-logs/build.log
          echo "run ${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA} version ${VERSION} result ${OUTCOME}" > /tmp/ci-logs/STATUS
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Build ${GITHUB_RUN_NUMBER}: ${OUTCOME}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-logs:ci-logs${OUT_SUFFIX}"

      - name: Screenshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          LOG="$RUNNER_TEMP/snapshots.log"
          # macOS has no timeout command; perl's alarm stops the app if it hangs.
          perl -e 'alarm 150; exec @ARGV' "build/Disk Alert.app/Contents/MacOS/DiskAlert" --snapshots "$OUT" > "$LOG" 2>&1 || echo "Snapshot run exited with status $?" >> "$LOG"
          cp "$LOG" "$OUT/snapshots.log"
          cat "$OUT/snapshots.log"
          ls -la "$OUT"
          cd "$OUT"
          git init -q -b screenshots
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "screenshots:screenshots${OUT_SUFFIX}"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          RANGE="${LAST:+$LAST..}HEAD"
          {
            echo "## What's new"
            git log --no-merges --format='- %s' $RANGE
            echo
            echo "## Install"
            echo "Download **Disk-Alert-$VERSION.dmg**, open it and drag Disk Alert into Applications. Already installed? Use **Check for Updates** in the menu bar."
          } > notes.md
          gh release create "v$VERSION" build/*.dmg --target "$GITHUB_SHA" \
            --title "Disk Alert $VERSION" --notes-file notes.md --latest

      - name: Publish alpha
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.full }}
        run: |
          {
            echo "Alpha build from \`${GITHUB_REF_NAME}\`. Not fully tested and may be incomplete."
            echo
            echo "## Changes not yet in a public release"
            git log --no-merges --format='- %s' origin/main..HEAD
          } > notes.md
          gh release create "v$VERSION" build/*.dmg --target "$GITHUB_SHA" \
            --title "Disk Alert $VERSION" --notes-file notes.md --prerelease --latest=false
          # Keep only the five newest alphas.
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
